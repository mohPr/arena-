<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS · UI prototype</title>
<style>
/* ============ tokens ============ */
:root{
  --ink:#0B1220; --ink2:#1B2739; --line:#E3E8F0; --line2:#EEF2F7;
  --bg:#EEF1F7; --surface:#FFFFFF; --surface2:#F7F9FC;
  --txt:#101828; --txt2:#5A6779; --txt3:#8794A6;
  --brand:#1F55E0; --brand2:#2E6BF0; --brandtint:#E9F0FF;
  --pay:#0B8F62; --pay2:#0AA46F; --paytint:#E4F6EE;
  --amber:#B45309; --ambertint:#FDF1DC;
  --red:#C2262E; --redtint:#FCEAEB;
  --violet:#6B3FD4; --violetint:#F0EAFE;
  --slate:#475569;
  --r:14px; --r2:10px; --r3:8px;
  --sh1:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
  --sh2:0 8px 24px rgba(16,24,40,.10),0 2px 6px rgba(16,24,40,.06);
  --sh3:0 24px 60px rgba(16,24,40,.22);
  --focus:0 0 0 3px rgba(31,85,224,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--focus)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.num{font-variant-numeric:tabular-nums}
/* ============ preview bar (always LTR English) ============ */
.pb{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 14px;background:#0B1220;color:#E7ECF5;border-bottom:1px solid #1E2A3E}
.pb-title{font-weight:650;font-size:13px;letter-spacing:.02em;white-space:nowrap}
.pb-sep{width:1px;height:22px;background:#253449}
.seg{display:flex;background:#16223408;border:1px solid #2A3A52;border-radius:9px;overflow:hidden}
.pb .seg{background:#162234}
.seg button{background:transparent;border:0;color:#B9C6D8;font-size:12px;font-weight:600;padding:7px 12px;min-height:32px;min-width:44px}
.seg button[aria-pressed="true"]{background:#2E6BF0;color:#fff}
.pb-select{display:flex;align-items:center;gap:6px;font-size:12px;color:#B9C6D8}
.pb-select select{background:#162234;border:1px solid #2A3A52;color:#E7ECF5;border-radius:9px;padding:6px 8px;font-size:12px;min-height:32px}
.pb-btn{background:#162234;border:1px solid #2A3A52;color:#E7ECF5;border-radius:9px;padding:6px 12px;font-size:12px;font-weight:600;min-height:32px}
.pb-btn:hover{background:#1D2C42}
.pb-btn.primary{background:#2E6BF0;border-color:#2E6BF0;color:#fff}
.pb-note{margin-inline-start:auto;font-size:11.5px;color:#93A3B8;white-space:nowrap}
.pinpop{position:fixed;z-index:70;background:#fff;color:var(--txt);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--sh3);padding:12px;width:280px}
.pinpop h4{margin:0 0 2px;font-size:13px}
.pinpop p{margin:0 0 8px;font-size:11.5px;color:var(--txt2)}
.pin-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 8px;border-radius:8px;font-size:12.5px}
.pin-row:nth-child(odd){background:var(--surface2)}
.pin-row b{font-weight:600}
.pin-row span{color:var(--txt2)}
.pin-code{font-weight:700;letter-spacing:.14em;background:var(--brandtint);color:#1B3EA8;padding:3px 8px;border-radius:6px}
/* ============ stage / frames ============ */
.stage{padding:18px;display:flex;justify-content:center;align-items:flex-start}
.framewrap{position:relative}
.frame{background:var(--surface);transform-origin:top left;overflow:hidden;position:relative}
.frame-pc{width:1440px;height:900px;border-radius:6px;box-shadow:var(--sh2);border:1px solid var(--line)}
.frame-phone{width:390px;height:844px;border-radius:34px;box-shadow:var(--sh3),0 0 0 10px #0B1220;border:1px solid #0B1220}
@media (max-width:420px){
  .stage{padding:0}
  .frame-phone{border-radius:0;box-shadow:none;border:0;box-shadow:0 0 0 0 #0B1220}
}
/* ============ app shell ============ */
.app{height:100%;display:flex;flex-direction:column;background:#E8EEF8;overflow:hidden}
.app[dir="rtl"] .flip{transform:scaleX(-1)}
.topbar{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:10px;padding:0 16px;
  background:#151C2E;color:#EAF0F9}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(140deg,#4C7DFF,#12B76A);
  display:flex;align-items:center;justify-content:center;flex:0 0 32px}
.tb-shop{font-weight:750;font-size:15px;letter-spacing:.01em;white-space:nowrap}
.tb-till{font-size:12px;color:#A9B8CE;background:#222B44;border:1px solid #33405C;border-radius:8px;padding:4px 9px;white-space:nowrap}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap;letter-spacing:.02em}
.b-demo{background:#2A3654;color:#C9D6EC;border:1px solid #3A4E70}
.b-trial{background:#4A3A12;color:#F3D69A;border:1px solid #6B5522}
.tb-shift{font-size:12px;color:#A9B8CE;display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot-live{width:7px;height:7px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 3px rgba(34,197,94,.22)}
.tb-right{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.tb-clock{font-size:12.5px;color:#C6D2E4;text-align:end;line-height:1.25;white-space:nowrap}
.icon-btn{width:38px;height:38px;min-width:44px;min-height:38px;display:flex;align-items:center;justify-content:center;
  background:#222B44;border:1px solid #33405C;border-radius:11px;color:#CBD8EC;position:relative}
.icon-btn:hover{background:#2C3654}
.icon-btn .cnt{position:absolute;top:-5px;inset-inline-end:-5px;background:#E11D48;color:#fff;font-size:10px;font-weight:800;
  border-radius:9px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #151C2E}
.avatar{width:34px;height:34px;min-width:34px;border-radius:50%;background:linear-gradient(140deg,#4C7DFF,#7A5AF8);
  color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.userchip{display:flex;align-items:center;gap:8px;background:#222B44;border:1px solid #33405C;border-radius:22px;padding:3px 12px 3px 3px}
.userchip .un{font-size:12.5px;font-weight:650;line-height:1.15;text-align:start}
.userchip .ur{font-size:10.5px;color:#A9B8CE}
.appbody{flex:1;display:flex;min-height:0}
.side{width:92px;flex:0 0 92px;background:#151C2E;color:#C2CFE2;
  display:flex;flex-direction:column;padding:10px 8px;gap:4px;overflow:auto}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;min-height:58px;
  border-radius:14px;border:0;background:transparent;color:#9AA8C0;font-size:10.5px;font-weight:700;text-align:center;width:100%;letter-spacing:.01em}
.nav-item:hover{background:#222B44;color:#E6EDF8}
.nav-item[aria-current="page"]{background:#3B6FF6;color:#fff;box-shadow:0 8px 18px rgba(59,111,246,.38)}
.nav-item svg{flex:0 0 22px}
.side-foot{margin-top:auto;padding:8px 4px;font-size:9.5px;color:#6B7A94;line-height:1.35;text-align:center}
.main{flex:1;display:flex;min-width:0;padding:12px;gap:12px;background:#E8EEF8}
.catalog{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.cartcol{width:480px;flex:0 0 480px;background:#fff;border-radius:22px;box-shadow:0 10px 32px rgba(21,28,46,.08);
  display:flex;flex-direction:column;min-height:0;overflow:hidden}
/* ============ scan hero ============ */
.scan-hero{position:relative;background:linear-gradient(180deg,#F4F7FF 0%,#E8EFFF 100%);
  border:1.5px solid #D6E0F5;border-radius:20px;min-height:132px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;color:#1E3A8A;padding:16px 16px 12px}
.scan-hero .corners{position:absolute;inset:12px;pointer-events:none}
.scan-hero .corners span{position:absolute;width:18px;height:18px;border-color:#7AA2FF;border-style:solid}
.scan-hero .corners .tl{top:0;left:0;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
.scan-hero .corners .tr{top:0;right:0;border-width:3px 3px 0 0;border-radius:0 4px 0 0}
.scan-hero .corners .bl{bottom:0;left:0;border-width:0 0 3px 3px;border-radius:0 0 0 4px}
.scan-hero .corners .br{bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 4px 0}
.scan-hero .sh-title{font-size:22px;font-weight:800;letter-spacing:-.01em;color:#0F172A}
.scan-hero .sh-sub{font-size:13px;color:#64748B;font-weight:550}
.scanbar{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #D6E0F5;
  border-radius:14px;padding:4px 8px 4px 12px;margin-top:8px;width:100%;max-width:560px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.scanbar .sic{flex:0 0 22px;color:#3B6FF6}
.scanbar input{flex:1;border:0;background:transparent;font-size:15px;font-weight:600;min-height:40px;outline:none}
.scanbar input::placeholder{color:#94A3B8;font-weight:500}
.kbd{font-size:11px;font-weight:700;color:#64748B;background:#F1F5F9;border:1px solid #E2E8F0;
  border-bottom-width:2px;border-radius:6px;padding:3px 7px;white-space:nowrap}
.scanhint{display:none}
.sec-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.04em;
  color:#475569;margin:2px 2px 0}
.sec-h .dot{width:6px;height:6px;border-radius:50%;background:#3B6FF6}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:thin}
.chip{display:flex;align-items:center;gap:8px;flex:0 0 auto;background:#fff;border:1px solid #E2E8F0;
  border-radius:14px;padding:6px 12px 6px 6px;min-height:52px;box-shadow:0 1px 2px rgba(15,23,42,.04);text-align:start}
.chip:hover{border-color:#93C5FD;background:#F8FBFF}
.chip[disabled]{opacity:.5}
.chip .ci{width:36px;height:36px;min-width:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.chip .cn{font-size:12.5px;font-weight:700;line-height:1.15;max-width:132px}
.chip .cp{font-size:11.5px;color:#64748B;font-weight:650}
.cat-chip{flex:0 0 auto;border:1px solid #E2E8F0;background:#fff;border-radius:999px;padding:8px 14px;
  min-height:38px;font-size:12.5px;font-weight:650;color:#475569;display:flex;align-items:center;gap:7px}
.cat-chip[aria-pressed="true"]{background:#151C2E;border-color:#151C2E;color:#fff}
.cat-chip .n{font-size:11px;background:#F1F5F9;color:#64748B;border-radius:999px;padding:1px 6px;font-weight:750}
.cat-chip[aria-pressed="true"] .n{background:#2B3A55;color:#CBD8EC}
/* quick products — mockup style */
.qprod{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.qtile{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border:1px solid #E8EEF4;
  border-radius:16px;padding:10px 6px 8px;min-height:96px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.qtile:hover{border-color:#93C5FD;transform:translateY(-1px);box-shadow:0 6px 16px rgba(59,111,246,.12)}
.qtile[disabled]{opacity:.5}
.qtile .qi{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.qtile .qn{font-size:11.5px;font-weight:700;text-align:center;line-height:1.2;color:#0F172A;max-width:100%;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qtile .qp{font-size:11px;font-weight:800;color:#3B6FF6}
/* open carts tray */
.tray{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:2px}
.cart-chip{flex:0 0 auto;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #E2E8F0;
  border-radius:14px;padding:6px 11px;min-height:48px;text-align:start;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.cart-chip[aria-pressed="true"]{border-color:#3B6FF6;background:#EEF4FF;box-shadow:0 0 0 3px rgba(59,111,246,.14)}
.cart-chip .t{font-size:10.5px;font-weight:800;color:#3B6FF6;letter-spacing:.04em}
.cart-chip[aria-pressed="true"] .t{color:#1E3A8A}
.cart-chip .m{font-size:12px;font-weight:650;max-width:190px;line-height:1.2}
.cart-chip .s{font-size:11px;color:#64748B}
.cart-chip .x{width:26px;height:26px;min-width:26px;border-radius:8px;border:1px solid #E2E8F0;background:#F8FAFC;
  display:flex;align-items:center;justify-content:center;color:#64748B}
.cart-chip .x:hover{background:#FEE4E2;color:#E11D48;border-color:#FECDD3}
.newcart{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:1.5px dashed #93C5FD;background:#F5F9FF;
  color:#1E3A8A;border-radius:14px;padding:6px 13px;min-height:48px;font-size:12.5px;font-weight:750}
.newcart:hover{background:#EEF4FF}
/* ============ product grid ============ */
.gridbody{flex:1;min-height:0;overflow:auto;padding:2px 2px 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.tile{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #E8EEF4;border-radius:14px;
  padding:7px;min-height:72px;text-align:start;box-shadow:0 1px 2px rgba(15,23,42,.04);position:relative}
.tile:hover{border-color:#93C5FD;box-shadow:0 0 0 3px rgba(59,111,246,.12)}
.tile[disabled]{opacity:.55;background:#F8FAFC}
.tile .ti{width:44px;height:44px;min-width:44px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.tile .tn{font-size:12.5px;font-weight:700;line-height:1.18;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#0F172A}
.tile .tp{font-size:13.5px;font-weight:800;margin-top:2px;color:#0F172A}
.tile .tu{font-size:10.5px;color:#94A3B8;font-weight:600}
.stk{font-size:9.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;border-radius:6px;padding:2px 6px;
  border:1px solid transparent;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.stk svg{width:9px;height:9px}
.s-ok{color:#047857;background:#D1FAE5;border-color:#A7F3D0}
.s-low{color:#B45309;background:#FEF3C7;border-color:#FDE68A}
.s-out{color:#BE123C;background:#FFE4E6;border-color:#FECDD3}
.s-neg{color:#9D174D;background:#FCE7F3;border-color:#FBCFE8}
.s-exp{color:#6D28D9;background:#EDE9FE;border-color:#DDD6FE}
.s-wei{color:#334155;background:#E2E8F0;border-color:#CBD5E1}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:28px 12px;
  color:#64748B;text-align:center;border:1.5px dashed #D6E0F5;border-radius:16px;background:#F8FBFF}
.empty b{font-size:14px;color:#0F172A}
.empty p{margin:0;font-size:12.5px}
/* ============ cart panel ============ */
.cp-head{padding:14px 16px 10px;border-bottom:1px solid #F1F5F9;display:flex;flex-direction:column;gap:8px;background:#fff}
.cp-title{display:flex;align-items:center;gap:8px}
.cp-title h2{margin:0;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;color:#0F172A}
.count-pill{font-size:11.5px;font-weight:800;background:#EEF4FF;color:#1E3A8A;border-radius:999px;padding:4px 10px}
.ticket{font-size:11.5px;color:#64748B;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;padding:3px 8px;font-weight:700}
.mini{min-height:36px;border-radius:10px;border:1px solid #E2E8F0;background:#fff;color:#475569;
  font-size:12px;font-weight:700;padding:5px 10px;display:inline-flex;align-items:center;gap:6px}
.mini:hover{border-color:#93C5FD;color:#3B6FF6;background:#F8FBFF}
.mini.danger:hover{border-color:#FECDD3;background:#FFF1F2;color:#E11D48}
.cust{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:14px;padding:8px 10px}
.cust .ca{width:34px;height:34px;min-width:34px;border-radius:10px;background:#151C2E;color:#fff;font-size:12.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.cust .cn{font-size:13.5px;font-weight:750;line-height:1.15}
.cust .cs{font-size:11px;color:#64748B}
.cust .chg{margin-inline-start:auto}
.lines{flex:1;min-height:0;overflow:auto;padding:8px 12px;background:#FAFBFE;display:flex;flex-direction:column}
.line{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #EEF2F7;border-radius:14px;
  padding:8px 8px;margin-bottom:8px;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.line .li{width:44px;height:44px;min-width:44px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.line .ln{flex:1;min-width:0}
.line .nm{font-size:13.5px;font-weight:750;line-height:1.2;color:#0F172A}
.line .mt{font-size:11.5px;color:#64748B;margin-top:2px}
.qty{display:flex;align-items:center;gap:2px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:2px}
.qty button{width:30px;height:30px;min-width:30px;border-radius:8px;border:0;background:#fff;color:#0F172A;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.qty button:hover{background:#EEF4FF;color:#3B6FF6}
.qty button[disabled]{opacity:.35;cursor:not-allowed}
.qty .qv{min-width:28px;text-align:center;font-size:13px;font-weight:800}
.lt{font-size:15px;font-weight:800;white-space:nowrap;color:#0F172A}
.del{width:36px;height:36px;min-width:36px;border-radius:11px;border:0;background:#FFF1F2;
  color:#E11D48;display:flex;align-items:center;justify-content:center}
.del:hover{background:#FFE4E6}
.cempty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;flex:1 1 auto;min-height:160px;
  margin:auto 0;width:100%;color:#64748B;text-align:center;padding:20px}
.cempty .ring{width:76px;height:76px;border-radius:50%;background:#fff;border:1.5px dashed #D6E0F5;
  display:flex;align-items:center;justify-content:center;color:#94A3B8}
.cempty b{color:#0F172A;font-size:16px}
.cempty p{margin:0;font-size:12.5px;max-width:230px}
/* money dock — the visual hero */
.money{padding:10px 14px 14px;background:#fff;border-top:1px solid #F1F5F9;display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:#64748B;padding:1px 2px}
.trow .v{font-weight:700;color:#0F172A}
.total-hero{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;
  border-radius:18px;background:linear-gradient(135deg,#EEF3FF 0%,#E0E9FF 100%);border:1px solid #D6E0F5}
.total-hero .th-l{display:flex;flex-direction:column;gap:2px}
.total-hero .th-k{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748B}
.total-hero .th-v{font-size:42px;line-height:.95;font-weight:800;letter-spacing:-.03em;color:#0F172A}
.total-hero .th-ic{width:56px;height:56px;border-radius:16px;background:#fff;color:#3B6FF6;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(59,111,246,.16)}
.qcash{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.qcash button{min-height:52px;border-radius:12px;border:1px solid #E2E8F0;background:#F8FAFC;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:1px}
.qcash button:hover{border-color:#93C5FD;background:#EEF4FF}
.qcash .qv{font-size:14px;font-weight:800;color:#0F172A}
.qcash .ql{font-size:9.5px;color:#94A3B8;font-weight:750;letter-spacing:.04em;text-transform:uppercase}
.qcash .star{color:#F59E0B}
.payrow{display:flex;gap:8px}

var NBSP = '\u00A0', NNSP = '\u202F';
function fmt(c){
  c = Math.round(c);
  var neg = c < 0; var a = Math.abs(c);
  var int = Math.floor(a/100).toString();
  var grp = int.replace(/\B(?=(\d{3})+(?!\d))/g, NNSP);

function addProduct(pid, grams){
  var p = P(pid); if(!p) return;
  var c = activeCart();
  if(p.st === 'out'){ toast(t('outBlocked') + NBSP + '· ' + p.name, 'err'); return; }
  if(p.wei){ state.overlay = {type:'weight', pid:pid, grams:grams || 1000}; render(); return; }
  for(var i=0;i<c.lines.length;i++){
    if(c.lines[i].type === 'unit' && c.lines[i].pid === pid){
      c.lines[i].qty++; c.lines[i].total = c.lines[i].qty * c.lines[i].price;
      toast(p.name + NBSP + '· ' + t('added'), 'ok'); return;
    }
  }
  c.lines.push({key:pid, type:'unit', pid:pid, qty:1, price:p.price, total:p.price});
  if(p.st === 'neg') toast(p.name + ' · ' + t('neg') + ' (' + p.stock + ')', 'err');
  else toast(p.name + NBSP + '· ' + t('added'), 'ok');
}
function addDivers(label, cents){
  var c = activeCart();
  var name = (label && label.trim()) ? label.trim() : t('customItem');
  c.lines.push({key:'d' + state.toastId, type:'div', name:name, total:cents});
  toast(name + NBSP + '· ' + fmt(cents) + NBSP + t('added'), 'ok');
}
function addWeighed(pid, grams){
  var p = P(pid); var c = activeCart();
  var total = Math.round(grams * p.price / 1000);
  for(var i=0;i<c.lines.length;i++){
    if(c.lines[i].type === 'wei' && c.lines[i].pid === pid){
      c.lines[i].grams += grams; c.lines[i].total = Math.round(c.lines[i].grams * p.price / 1000);
      toast(p.name + NBSP + '· ' + t('added'), 'ok'); return;
    }
  }
  c.lines.push({key:pid, type:'wei', pid:pid, grams:grams, priceKg:p.price, total:total});
  toast(p.name + NBSP + '· ' + fmtKg(grams) + NBSP + t('added'), 'ok');
}
function changeQty(key, delta){
  var c = activeCart();
  for(var i=0;i<c.lines.length;i++){
    var l = c.lines[i];
    if(l.key === key){
      if(l.type === 'wei'){
        var ng = l.grams + delta * 250;
        if(ng <= 0){ removeLine(key); return; }
        l.grams = ng; l.total = Math.round(l.grams * l.priceKg / 1000);
      } else {
        var nq = l.qty + delta;
        if(nq <= 0){ removeLine(key); return; }
        l.qty = nq; l.total = l.qty * l.price;
      }
      render(); return;
    }
  }
}
function removeLine(key){
  var c = activeCart();
  for(var i=0;i<c.lines.length;i++){
    if(c.lines[i].key === key){
      var line = c.lines.splice(i,1)[0];
      state.lineUndo = {cartId:c.id, line:line, index:i, until:Date.now() + 5000};
      toast(lineName(line) + NBSP + '· ' + t('removed'), '', t('undo'), function(){
        var cc = cart(state.lineUndo.cartId);
        if(cc){ cc.lines.splice(Math.min(state.lineUndo.index, cc.lines.length), 0, state.lineUndo.line); }
        state.lineUndo = null; render();
      });
      return;
    }
  }
}
function undoLine(){
  if(!state.lineUndo) return;
  var cc = cart(state.lineUndo.cartId);
  if(cc) cc.lines.splice(Math.min(state.lineUndo.index, cc.lines.length), 0, state.lineUndo.line);
  state.lineUndo = null; render();
}

function closeCart(id){
  var idx = -1;
  for(var i=0;i<state.carts.length;i++){ if(state.carts[i].id === id) idx = i; }
  if(idx < 0) return;
  var wasActive = state.carts[idx].id === state.active;
  state.carts.splice(idx,1);
  if(!state.carts.length){ state.carts.push({id:state.nextCartId++, custId:'c0', lines:[]}); }
  if(wasActive) state.active = state.carts[Math.max(0, idx-1)].id;
  render();
}

function restoreBalances(o){ for(var i=0;i<CUSTOMERS.length;i++) CUSTOMERS[i].bal = o[CUSTOMERS[i].id]; }

function completeSale(method, receivedC, cashC, creditC, custId){
  var c = activeCart(); var tt = cartTotals(c);
  var cust = C(custId || c.custId);
  var change = method === 'cash' ? Math.max(0, (receivedC||0) - tt.sub) : Math.max(0, (cashC||0) - (creditC ? tt.sub - creditC : 0));
  var rec = {
    ticket: state.ticket, time: DEMO_TIME, lines: clone(c.lines), sub: tt.sub, items: tt.items,
    method: method, received: receivedC || 0, cash: cashC || 0, credit: creditC || 0,
    change: change, custName: cust.name, custId: cust.id, cashier: user().name, role: state.role,
    balAfter: cust.bal
  };
  var bals = snapshotBalances();
  if(creditC > 0) cust.bal += creditC;
  state.saleUndo = {
    until: Date.now() + 10000, cart: clone(c), ticket: state.ticket, bals: bals,
    creditC: creditC, custId: cust.id, receipt: rec
  };
  state.lastReceipt = rec;
  state.ticket = bumpTicket(state.ticket);
  state.carts.splice(state.carts.indexOf(c),1);
  state.carts.push({id:state.nextCartId++, custId:'c0', lines:[]});
  state.active = state.carts[state.carts.length-1].id;
  state.search = ''; state.cat = 'all';
  state.overlay = {type:'success'};
  render();
}
function voidSale(){
  if(!state.saleUndo) return;
  restoreBalances(state.saleUndo.bals);
  var c = state.saleUndo.cart;
  c.id = state.nextCartId++;
  state.carts.push(c); state.active = c.id;
  state.ticket = state.saleUndo.ticket;
  state.lastReceipt = null; state.saleUndo = null; state.overlay = null;
  toast(t('voidSale') + ' · ' + state.ticket, 'ok');
  render();
}

}

  var auto = document.querySelector('[data-autofocus]');

/* ================= payment calculations ================= */
function payVals(){
  var tt = cartTotalInt();
  if(state.payTab === 'cash'){
    var el = document.getElementById('cashIn');
    var v = parseMoney(el ? el.value : (state.payCash || ''));
    return {tt:tt, cash:isNaN(v)?0:v, credit:0, received:isNaN(v)?0:v};
  }
  if(state.payTab === 'mixed'){
    var el2 = document.getElementById('mixCash');
    var c = parseMoney(el2 ? el2.value : (state.payMix || ''));
    if(isNaN(c)) c = 0;
    var cr = Math.max(0, tt - c);
    if(c > tt) cr = 0;
    return {tt:tt, cash:c, credit:cr, received:c};
  }
  return {tt:tt, cash:0, credit:tt, received:0};
}
function updatePayCalc(){
  if(!state.overlay || state.overlay.type !== 'pay') return;
  var tt = cartTotalInt(), v = payVals(), box = document.getElementById('dueBox'), due = document.getElementById('dueVal');
  var note = document.getElementById('payNote'), btn = document.getElementById('payConfirm');
  if(state.payTab === 'cash'){
    var change = v.cash - tt;
    if(box){ box.className = 'duebox' + (v.cash < tt ? ' bad' : ''); }
    if(due){ due.textContent = fmt(v.cash < tt ? 0 : change); }
    if(box){
      var lbl = box.querySelector('.dl');
      if(lbl) lbl.textContent = v.cash < tt ? t('missing') + ' ' + fmt(tt - v.cash) : t('changeDue');
    }
    if(note){
      if(!v.cash){ note.className = 'note'; note.innerHTML = svg('info',16)+'<span>'+t('quickCash')+'</span>'; }
      else if(v.cash < tt){ note.className = 'note err'; note.innerHTML = svg('alert',16)+'<span>'+t('insufficient')+' ('+t('missing')+' '+fmt(tt-v.cash)+')</span>'; }
      else { note.className = 'note ok'; note.innerHTML = svg('check',16)+'<span>'+t('changeDue')+' '+fmt(change)+'</span>'; }
    }
    if(btn){ btn.disabled = !(v.cash >= tt && tt > 0); }
  } else if(state.payTab === 'mixed'){
    var mc = document.getElementById('mixCredit');
    if(mc) mc.textContent = fmt(v.credit);
    var cu = custOf(activeCart()), avail = cu.limit - cu.bal;
    var ok = v.cash <= v.tt && !cu.walkin && v.credit <= avail;
    if(note){
      if(cu.walkin){ note.className = 'note err'; note.innerHTML = svg('alert',16)+'<span>'+t('creditNeedCust')+'</span>'; }
      else if(v.credit > avail){ note.className = 'note err'; note.innerHTML = svg('alert',16)+'<span>'+t('limitExceeded')+'</span>'; }
      else if(v.cash > v.tt){ note.className = 'note err'; note.innerHTML = svg('alert',16)+'<span>'+t('insufficient')+'</span>'; }
      else { note.className = 'note ok'; note.innerHTML = svg('check',16)+'<span>'+t('cashPart')+' '+fmt(v.cash)+' + '+t('creditPart')+' '+fmt(v.credit)+'</span>'; }
    }
    if(btn) btn.disabled = !ok;
  }
}
function setTarget(target, val){
  var el = document.getElementById(target);
  if(!el) return;
  el.value = val; el.focus();
  try{ el.setSelectionRange(val.length, val.length); }catch(e){}
  if(target === 'cashIn'){ state.payCash = val; updatePayCalc(); }
  else if(target === 'mixCash'){ state.payMix = val; updatePayCalc(); }
  else if(target === 'divAmt'){ updateDivers(); }
  else if(target === 'wtIn'){ updateWeight(); }
}
function typeKey(k, target){
  var el = document.getElementById(target); if(!el) return;
  var v = el.value;
  if(k === 'back') v = v.slice(0,-1);
  else if(k === '00') v = v + '00';
  else v = v + k;
  setTarget(target, v);
}
function updateDivers(){
  var el = document.getElementById('divAmt'); if(!el) return;
  var c = parseMoney(el.value); if(isNaN(c)) c = 0;
  var pv = document.getElementById('divPreview'); if(pv) pv.textContent = fmt(c);
  var btn = document.getElementById('divConfirm'); if(btn) btn.disabled = !(c > 0);
}
function updateWeight(){
  var el = document.getElementById('wtIn'); if(!el) return;
  var g = parseGrams(el.value);
  var o = state.overlay, p = P(o.pid);
  var pv = document.getElementById('wtPreview'); if(pv) pv.textContent = fmt(Math.round(g * p.price / 1000));
}
function parseGrams(s){
  var str = String(s === undefined || s === null ? '' : s).replace(/\s|\u00A0|\u202F/g,'').replace(/,/g,'.');
  var v = parseFloat(str.replace(/[^\d.]/g,''));
  if(isNaN(v) || v < 0) return 0;
  return Math.round(v * 1000); /* kg typed with decimals -> integer grams */
}

function closeOverlay(keepToast){
  state.overlay = null;
  state.payCash = ''; state.payMix = '';
  render();
  if(state.saleUndo && state.lastReceipt && !keepToast && !state.toasts.some(function(s){ return s.af; })){
    toast(t('ticket')+' '+state.lastReceipt.ticket+' · '+fmt(state.lastReceipt.sub)+' · '+t('total')+' '+fmt(state.lastReceipt.sub),
      '', t('voidSale'), function(){ voidSale(); }, 10000);
  }
  focusScan();
}
function focusScan(){
  var el = document.getElementById('scanIn');
  if(el){ try{ el.focus(); }catch(e){} }
}
function handle(act, ds, el){
  switch(act){
    case 'nav':
      state.page = ds.page; state.overlay = null; render(); break;
    case 'newCart': newCart(); break;
    case 'selCart': selectCart(+ds.id); break;
    case 'closeCart': closeCart(+ds.id); break;
    case 'openCartSheet': state.overlay = {type:'carts'}; render(); break;
    case 'add': addProduct(ds.pid); focusScan(); break;
    case 'cat': state.cat = ds.cat; render(); focusScan(); break;
    case 'clearSearch': state.search = ''; state.cat = 'all'; render(); focusScan(); break;
    case 'focusScan': state.overlay = null; render(); focusScan(); break;
    case 'qty': changeQty(ds.key, +ds.d); break;
    case 'del': removeLine(ds.key); break;
    case 'askClear': state.overlay = {type:'clear'}; render(); break;
    case 'clearConfirm': clearCart(); break;
    case 'divers': state.overlay = {type:'divers', cents:0}; render(); break;
    case 'addDivers': {
      var lab = document.getElementById('divLabel'), amt = document.getElementById('divAmt');
      var cents = parseMoney(amt ? amt.value : ''); if(isNaN(cents) || cents <= 0){ toast(t('amount')+' ?', 'err'); return; }
      state.overlay = null; addDivers(lab ? lab.value : '', cents); focusScan(); break;
    }
    case 'wt': setTarget('wtIn', (parseInt(ds.g,10)/1000).toFixed(3).replace('.',',')); updateWeight(); break;
    case 'addWei': {
      var o = state.overlay, g = parseGrams(document.getElementById('wtIn').value);
      state.overlay = null;
      if(g > 0) addWeighed(o.pid, g); else toast(t('weight')+' ?', 'err');
      focusScan(); break;
    }
    case 'pickCust': state.overlay = {type:'customer'}; render(); break;
    case 'setCust': setCustomer(ds.id); break;
    case 'paySheet': state.payTab = 'cash'; state.payCash = ''; state.payMix = ''; state.overlay = {type:'pay'}; render(); break;
    case 'payCredit': {
      var cc0 = activeCart();
      if(!cc0.lines.length) return;
      state.payTab = 'credit'; state.payCash = ''; state.payMix = ''; state.overlay = {type:'pay'}; render(); break;
    }
    case 'qcash': {
      var cc1 = activeCart(), tot = cartTotalInt(), amt = parseInt(ds.v,10);
      if(!cc1.lines.length || tot <= 0) return;
      if(amt >= tot){ completeSale('cash', amt, amt, 0, cc1.custId); }
      else { state.payTab = 'cash'; state.payCash = fmtPlain(amt); state.overlay = {type:'pay'}; render(); }
      break;
    }
    case 'payTab': state.payTab = ds.tab; state.payCash = ''; state.payMix = ''; render(); break;
    case 'quickAmt': setTarget(ds.target, fmtPlain(parseInt(ds.v,10))); break;
    case 'key': typeKey(ds.k, ds.target); break;
    case 'quickPay': {
      var c = activeCart(), tt = cartTotalInt();
      if(!c.lines.length || tt <= 0) return;
      completeSale('cash', tt, tt, 0, c.custId); break;
    }
    case 'confirmPay': {
      var v = payVals(), cc = activeCart();
      if(v.tt <= 0) return;
      if(state.payTab === 'cash'){ if(v.cash < v.tt) return; completeSale('cash', v.cash, v.cash, 0, cc.custId); }
      else if(state.payTab === 'credit'){
        var cu = custOf(cc);
        if(cu.walkin){ toast(t('creditNeedCust'), 'err'); return; }
        if(v.credit > cu.limit - cu.bal){ toast(t('limitExceeded'), 'err'); return; }
        completeSale('credit', 0, 0, v.credit, cc.custId);
      } else {
        var cu2 = custOf(cc);
        if(v.cash > v.tt) return;
        if(cu2.walkin){ toast(t('creditNeedCust'), 'err'); return; }
        if(v.credit > cu2.limit - cu2.bal){ toast(t('limitExceeded'), 'err'); return; }
        completeSale('mixed', v.cash, v.cash, v.credit, cc.custId);
      }
      break;
    }
    case 'viewReceipt': state.overlay = {type:'receipt'}; render(); break;
    case 'print': toast(t('printLater'), '', null, null, 3000); break;
    case 'newSale': closeOverlay(); break;
    case 'voidSale': voidSale(); break;
    case 'alerts': state.overlay = {type:'alerts'}; render(); break;
    case 'toastAct': {
      var id = +ds.id;
      for(var i=0;i<state.toasts.length;i++){
        if(state.toasts[i].id === id){ var s = state.toasts.splice(i,1)[0]; if(s.af) s.af(); else render(); break; }
      }
      break;
    }
    case 'closeOv': closeOverlay(); break;
    case 'backdrop': if(el.classList.contains('ovl')) closeOverlay(); break;
  }
}
function fmtPlain(cents){
  var v = cents / 100;
  return (Math.round(v*1000)/1000).toString().replace('.', ',');
}
function onScanEnter(){
  var el = document.getElementById('scanIn'); if(!el) return;
  var q = el.value.trim();
  if(!q) return;
  var exact = null;
  for(var i=0;i<PRODUCTS.length;i++){ if(PRODUCTS[i].bc && PRODUCTS[i].bc === q) exact = PRODUCTS[i]; }
  var list = filtered();
  if(exact){ state.search = ''; addProduct(exact.id); render(); focusScan(); return; }
  if(list.length === 1){ var p = list[0]; state.search = ''; if(p.wei){ state.overlay={type:'weight',pid:p.id,grams:1000}; render(); } else { addProduct(p.id); render(); } focusScan(); return; }
  if(list.length > 1){ var p2 = list[0]; state.search = ''; addProduct(p2.id); render(); focusScan(); return; }
  toast(t('noRes')+' «'+q+'»', 'err');
}

/* ================= events ================= */
var appEl = document.getElementById('app');
appEl.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el) return;
  if(el.disabled) return;
  if(el.getAttribute('data-act') === 'backdrop' && e.target !== el) return;
  handle(el.getAttribute('data-act'), el.dataset, el);
});
appEl.addEventListener('input', function(e){
  var id = e.target.id;
  if(id === 'scanIn'){ state.search = e.target.value; renderGridOnly(); return; }
  if(id === 'cashIn'){ state.payCash = e.target.value; updatePayCalc(); return; }
  if(id === 'mixCash'){ state.payMix = e.target.value; updatePayCalc(); return; }
  if(id === 'divAmt'){ updateDivers(); return; }
  if(id === 'wtIn'){ updateWeight(); return; }
});
appEl.addEventListener('keydown', function(e){
  if(e.target.id === 'scanIn' && e.key === 'Enter'){ e.preventDefault(); onScanEnter(); return; }
  if(e.key === 'Enter' && e.target.tagName === 'INPUT'){
    var btn = document.querySelector('[data-trap] .m-foot button:not([disabled])');
    if(btn && (e.target.id === 'divAmt' || e.target.id === 'wtIn' || e.target.id === 'divLabel')){ e.preventDefault(); btn.click(); }
  }
});
function renderGridOnly(){
  var g = document.getElementById('gridHost');
  if(g){ g.innerHTML = gridInner(); return; }
  render();
}
document.addEventListener('keydown', function(e){
  if(state.overlay){
    if(e.key === 'Escape'){ e.preventDefault(); closeOverlay(); return; }
    if(e.key === 'Tab'){
      var trap = document.querySelector('[data-trap]');
      if(trap){
        var f = trap.querySelectorAll('button,input,select,[tabindex]:not([tabindex="-1"])');
        var list = [];
        for(var i=0;i<f.length;i++){ if(!f[i].disabled && f[i].offsetParent !== null) list.push(f[i]); }
        if(list.length){
          var first = list[0], last = list[list.length-1];
          if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
          else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
        }
      }
      return;
    }
    return;
  }
  if(e.key === 'F2'){ e.preventDefault(); handle('paySheet', {}); return; }
  if(e.key === 'Escape' && state.search){ state.search=''; render(); focusScan(); }
});
function tick(){
  var now = Date.now(), need = false;
  for(var i=state.toasts.length-1;i>=0;i--){ if(state.toasts[i].until <= now){ state.toasts.splice(i,1); need = true; } }
  var cds = document.querySelectorAll('[data-cd]');
  for(var j=0;j<cds.length;j++){
    var u = parseInt(cds[j].getAttribute('data-cd'),10);
    cds[j].textContent = Math.max(0, Math.ceil((u - now)/1000));
  }
  if(state.lineUndo && state.lineUndo.until <= now){ state.lineUndo = null; need = true; }
  if(state.saleUndo && state.saleUndo.until <= now){ state.saleUndo = null; need = true; }
  if(need) render();
}

/* ================= preview bar ================= */
function buildPreviewBar(){
  var sv = document.getElementById('segView');
  sv.innerHTML = '<button data-v="pc" aria-pressed="'+(state.view==='pc')+'">PC</button>' +
                 '<button data-v="phone" aria-pressed="'+(state.view==='phone')+'">Phone</button>';
  var sl = document.getElementById('segLang');
  sl.innerHTML = '<button data-l="fr" aria-pressed="'+(state.lang==='fr')+'">FR</button>' +
                 '<button data-l="ar" aria-pressed="'+(state.lang==='ar')+'">AR</button>' +
                 '<button data-l="en" aria-pressed="'+(state.lang==='en')+'">EN</button>';
  var rs = document.getElementById('roleSel');
  rs.innerHTML = '<option value="cashier"'+(state.role==='cashier'?' selected':'')+'>Cashier · Amine</option>' +
                 '<option value="manager"'+(state.role==='manager'?' selected':'')+'>Manager · Nadia</option>' +
                 '<option value="owner"'+(state.role==='owner'?' selected':'')+'>Owner · Karim</option>';
}
document.getElementById('segView').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  state.view = b.getAttribute('data-v'); state.overlay = null;
  buildPreviewBar(); layout(); render(); focusScan();
});
document.getElementById('segLang').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  state.lang = b.getAttribute('data-l'); state.overlay = null;
  buildPreviewBar(); render(); focusScan();
});
document.getElementById('roleSel').addEventListener('change', function(e){
  state.role = e.target.value; render();
});
document.getElementById('btnReset').addEventListener('click', function(){ resetDemo(); buildPreviewBar(); });
var pinpop = document.getElementById('pinpop'), btnPins = document.getElementById('btnPins');
btnPins.addEventListener('click', function(e){
  e.stopPropagation();
  var open = !pinpop.hidden;
  pinpop.hidden = open;
  btnPins.setAttribute('aria-expanded', String(!open));
  if(!open){
    var r = btnPins.getBoundingClientRect();
    pinpop.style.top = (r.bottom + 8) + 'px';
    pinpop.style.right = Math.max(8, window.innerWidth - r.right) + 'px';
    pinpop.innerHTML = '<h4>'+t('pinT')+'</h4><p>'+t('pinHint')+'</p>' +
      '<div class="pin-row"><span><b>Karim</b><br>Owner</span><span class="pin-code">1234</span></div>' +
      '<div class="pin-row"><span><b>Nadia</b><br>Manager</span><span class="pin-code">2345</span></div>' +
      '<div class="pin-row"><span><b>Amine</b><br>Cashier</span><span class="pin-code">3456</span></div>' +
      '<div class="pin-row"><span><b>Sofia</b><br>Cashier</span><span class="pin-code">4567</span></div>';
  }
});
document.addEventListener('click', function(e){
  if(!pinpop.hidden && !pinpop.contains(e.target) && e.target !== btnPins){ pinpop.hidden = true; btnPins.setAttribute('aria-expanded','false'); }
});

/* ================= layout / scaling ================= */
var stage = document.getElementById('stage'), wrap = document.getElementById('framewrap'), frame = document.getElementById('frame');
function layout(){
  var phone = state.view === 'phone';
  var W = phone ? 390 : 1440, H = phone ? 844 : 900;
  frame.className = 'frame ' + (phone ? 'frame-phone' : 'frame-pc');
  var pad = window.innerWidth <= 420 ? 0 : 36;
  var avail = Math.max(200, window.innerWidth - pad);
  var s = Math.min(1, avail / W);
  wrap.style.width = Math.round(W * s) + 'px';
  wrap.style.height = Math.round(H * s) + 'px';
  frame.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', layout);

/* ================= boot ================= */
var _origGridBody = gridBody;
gridBody = function(){ return '<div id="gridHost">' + _origGridBody() + '</div>'; };
function gridInner(){ return _origGridBody(); }
appEl.style.height = '100%';
buildPreviewBar();
layout();
render();
setInterval(tick, 200);
focusScan();
</script>
</body>
